  <rect x="350" y="156" width="140" height="21" rx="10" fill="#7e9fba" stroke="none"/>
  <path d="M112 293v26M232 293v26" stroke="#7f9fb9" stroke-width="15"/>
  <circle cx="260" cy="48" r="11" fill="#417bb0" stroke="none"/>
</g>
<!-- monitor + waveform -->
