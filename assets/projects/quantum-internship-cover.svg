  <rect x="24" y="24" width="307" height="167" rx="9" fill="#163957" stroke="#7fa9ce" stroke-opacity=".38"/>
  <path d="M36 107h65l19-42 31 97 25-51h34l20-28 23 24h63" stroke="#a9ddf2" stroke-width="8" stroke-linejoin="round" stroke-linecap="round" fill="none"/>
