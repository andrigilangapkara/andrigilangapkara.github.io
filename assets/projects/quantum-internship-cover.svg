<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-label="Biomedical instrumentation and radiodiagnostic internship illustration">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eff5fc"/><stop offset=".65" stop-color="#d8e7f7"/><stop offset="1" stop-color="#bcd3eb"/></linearGradient>
  <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#244e7c"/><stop offset="1" stop-color="#133455"/></linearGradient>
  <pattern id="grid" width="33" height="33" patternUnits="userSpaceOnUse"><path d="M 33 0 L 0 0 0 33" fill="none" stroke="#7c9abb" stroke-opacity=".17" stroke-width="1"/></pattern>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="25" flood-color="#31577e" flood-opacity=".15"/></filter>
</defs>
<rect width="1200" height="760" fill="url(#bg)"/><rect width="1200" height="760" fill="url(#grid)"/>
<circle cx="945" cy="10" r="330" fill="#fff" fill-opacity=".27"/><circle cx="150" cy="725" r="315" fill="#fff" fill-opacity=".24"/>
<rect x="77" y="77" width="1046" height="607" rx="40" fill="#fff" fill-opacity=".66" stroke="#fff" stroke-opacity=".87" stroke-width="2" filter="url(#shadow)"/>
<g font-family="Inter,Arial,sans-serif">
 <text x="128" y="140" font-size="22" font-weight="700" fill="#356696" letter-spacing="5">CLINICAL ENGINEERING</text>
 <text x="128" y="188" font-size="37" font-weight="800" fill="#14375d">Biomedical Instrumentation</text>
 <text x="128" y="226" font-size="28" font-weight="500" fill="#366489">&amp; Calibration Fieldwork</text>
</g>
<!-- CT system -->
