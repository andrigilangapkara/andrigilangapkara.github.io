  <rect width="115" height="82" rx="18"/><path d="M24 48h16l9-22 15 42 13-24h18" fill="none" stroke-width="5" stroke-linecap="round"/>
  <rect x="143" width="115" height="82" rx="18"/><path d="M169 19h63M169 31h63M175 48h52M188 48v17M213 48v17" stroke-width="4" stroke-linecap="round"/>
